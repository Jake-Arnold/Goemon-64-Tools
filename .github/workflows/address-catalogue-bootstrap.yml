name: Address catalogue registry synchronisation
on:
  push:
    branches:
      - toolkit/address-catalogue-20261117
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical address metadata and audit
        run: PYTHONPATH=. python -m scripts.sync_address_catalogue --write
      - name: Commit registry snapshots if changed
        shell: bash
        run: |
          set -euo pipefail
          git add practice/data/address_catalogue_v1.json practice/data/address_catalogue_audit.json
          if git diff --cached --quiet; then
            echo "No metadata changes"
            exit 0
          fi
          git -c user.name=goemon-registry-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "Sync authoritative address registry from reviewed manifests"
          git push origin HEAD:toolkit/address-catalogue-20261117
