name: Temporary Goemon archive33 source import and full CI
on:
  push:
    branches: [decomp/archive33-1556-20261120]
permissions:
  contents: write
jobs:
  source-import:
    if: ${{ startsWith(github.event.head_commit.message, 'chore') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and unpack source-only changes
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob 52ab6e0daccc71907a0d82734fe196986b4939fc > "$RUNNER_TEMP/source.tar.gz"
          printf '%s  %s\n' '92c1de76876da0061fad9398731eb76d998c100bc12c8515856fe0525ed89a13' "$RUNNER_TEMP/source.tar.gz" | sha256sum --check -
          python3 - "$RUNNER_TEMP/source.tar.gz" <<'PY'
          import pathlib, sys, tarfile
          with tarfile.open(sys.argv[1],'r:gz') as tar:
              members=tar.getmembers()
              assert len(members)==73,len(members)
              for m in members:
                  p=pathlib.PurePosixPath(m.name)
                  assert m.isfile() and not p.is_absolute() and '..' not in p.parts,m.name
                  assert p.parts[0] in {'decomp','tests'} or m.name=='PROGRESS.md',m.name
                  assert p.suffix in {'.c','.py','.md','.json'},m.name
              tar.extractall(path='.',filter='data')
          PY
      - name: Full ROM-free local CI including all original C sanitizers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m decomp.local_ci
      - name: Commit exact native verified promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Goemon exact native verified source"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- PROGRESS.md decomp tests
          git diff --cached --quiet && { echo "No source changes"; exit 1; }
          git commit -m "feat(decomp): promote 33 archive C functions to 1556 USA exact"
          git push origin HEAD:refs/heads/decomp/archive33-1556-20261120
