name: Temporary Goemon original archive61 source import and ROM-free validation
on:
  push:
    branches: [decomp/archive61-1617-20261120]
permissions:
  contents: write
jobs:
  import-sources:
    if: ${{ startsWith(github.event.head_commit.message, 'chore') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Authenticate and unpack complete source-only promotion
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob 6c7a299b6f3ce98b4ac46ec5c959ad633bd80b71 > "$RUNNER_TEMP/source.tar.gz"
          printf '%s  %s\n' '5a8d6485dbbb2e720640bf02fbdd946cfd9e69f630807b9bb40879e4ef1b4b2d' "$RUNNER_TEMP/source.tar.gz" | sha256sum --check -
          python3 - "$RUNNER_TEMP/source.tar.gz" <<'PY'
          import pathlib,sys,tarfile
          with tarfile.open(sys.argv[1],"r:gz") as tar:
              members=tar.getmembers()
              assert len(members)==103,len(members)
              for m in members:
                  p=pathlib.PurePosixPath(m.name)
                  assert m.isfile() and not p.is_absolute() and ".." not in p.parts,m.name
                  assert (p.parts[0] in {"decomp","tests"} or m.name=="PROGRESS.md"),m.name
                  assert p.suffix in {".c",".py",".md",".json"},m.name
              tar.extractall(path=".",filter="data")
          PY
      - name: Full local decomp CI on clean checkout (ROM-free only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m decomp.local_ci
      - name: Commit approved exact-native source promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Goemon exact native C import"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- PROGRESS.md decomp tests
          git diff --cached --quiet && { echo "No changed source files"; exit 1; }
          git commit -m "feat(decomp): promote all final 61 archive C to 1617 exact USA"
          git push origin HEAD:refs/heads/decomp/archive61-1617-20261120
