name: Temporary export current decomp source for original native verification
on:
  push:
    branches: [decomp/provisional342-recovery-20261120]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source and digest
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip -9 > "$RUNNER_TEMP/canonical-source.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum canonical-source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: goemon-decomp-canonical-source-1617-20261120
          path: |
            ${{ runner.temp }}/canonical-source.tar.gz
            ${{ runner.temp }}/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
