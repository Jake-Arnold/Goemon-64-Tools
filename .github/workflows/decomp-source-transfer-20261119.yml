name: Decomp temporary source transfer
on:
  push:
    branches: ["decomp/session-source-transfer-20261119"]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pack tracked public source only
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip -9 > "$RUNNER_TEMP/goemon-decomp-source.tar.gz"
          sha256sum "$RUNNER_TEMP/goemon-decomp-source.tar.gz" > "$RUNNER_TEMP/goemon-decomp-source.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: goemon-decomp-source-20261119
          path: |
            ${{ runner.temp }}/goemon-decomp-source.tar.gz
            ${{ runner.temp }}/goemon-decomp-source.sha256
          if-no-files-found: error
          retention-days: 1
