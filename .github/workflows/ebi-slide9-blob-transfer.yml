name: Ebi Slide9 exact blob transfer (temporary)
on:
  push:
    branches: [decomp/ebi-slide9-blob-transfer-20261126]
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'Jake-Arnold/Goemon-64-Tools' && github.ref == 'refs/heads/decomp/ebi-slide9-blob-transfer-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Reassemble verified source-only proof blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "9932e4bac45bd3f41513b2f6ff0eb8ee438d0997"
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          p = pathlib.Path('decomp/results/combined.json')
          old = p.read_bytes()
          assert hashlib.sha256(old).hexdigest() == '7f636e93cbffe3f8df28594035e7df5e61c86143791d60e1137ff24d7b117ba6'
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == 'bc554c2a66aceb8e598efe1570a89c22bb53b8f6'
          ops = json.loads(zlib.decompress(base64.b64decode(pathlib.Path('decomp/research/ebi_slide9_blob_transfer/combined-patch.b64').read_bytes(),validate=True)))
          lines = old.decode('utf-8').split('\n')
          new = '\n'.join(v for op in ops for v in (lines[op[0]:op[1]] if isinstance(op[0],int) else op)).encode('utf-8')
          assert len(new) == 3882129
          assert hashlib.sha256(new).hexdigest() == 'ebbbf2f1ed695750ecaaccda600632ca8d477c4cff1e837357d1b76889080104'
          p.write_bytes(new)
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip() == '2d45737f29734ad68903d238892dfbbd2bd61fab'
          PY
          git add -- decomp/results/combined.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Transport exact Ebi Slide9 canonical proof blob'
          git push origin HEAD:refs/heads/decomp/ebi-slide9-blob-transfer-20261126
