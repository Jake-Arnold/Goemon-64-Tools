name: Verified file11 179-C promotion application
on:
  push:
    branches:
      - chatgptweb/file11-179-promotion-20261116
permissions:
  contents: write
jobs:
  apply-verified-promotion:
    if: contains(github.event.head_commit.message, '[apply-file11-179]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned 315-C production parent and patch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Apply verified source-only patch with fail-closed checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7255b2fa59b376c0e03346f434f82d4d02e639e0"
          test -f .promotion/file11-342.patch.xz.b64
          base64 -d .promotion/file11-342.patch.xz.b64 | xz -d > /tmp/file11-342.patch
          echo "a9a7549f402497990949b59297f55744dbd1854e68fb8e9387fb69ea015240ae  /tmp/file11-342.patch" | sha256sum -c -
          cp decomp/manifest.json decomp/manifest_315_preserved_20261116.json
          cp decomp/results/combined.json decomp/results/combined_315_preserved_20261116.json
          cp decomp/results/inventory.json decomp/results/inventory_315_preserved_20261116.json
          git apply --check /tmp/file11-342.patch
          git apply /tmp/file11-342.patch
          cat > /tmp/file11-342-pinned-hashes <<'HASHES'
          291d239c29f5a404cac932c9481397571074b85a50eb0e2aefee6fd190aeebb5  decomp/manifest.json
          512dcb943e7fbe3c5ecdaf715aff9e8b499fa4dbb96f4d94810833d112b7aa3e  decomp/verify.py
          1812f38bc430f53fa338849746d9526be12394186eac01859f0b3920e27f36a9  decomp/file11_179_stage.py
          51298ac118414025a9429450777cb3d4537827e3b59ca8e7c00951661c3d4cb3  decomp/research/file11_143_candidate/file11_179_source_fixture.json
          20e7f59c89d5b0fcdce2010937ead2bc3df5356ffab8986d856f7158923e81dd  decomp/results/combined.json
          8cbcaedb9cedd33e9f0c8ce776cbfc15122d0b94512df054bc4566ded2b38962  decomp/results/inventory.json
          5c08d6b7310f30503d568c96a68be1d966d75efb251d8e6a9325587da7873b08  decomp/results/vm_residual_inventory.json
          176228f19d9a3312b031544f5a3c40f90713d83e05f2c6b3d7827e2adb63c93d  PROGRESS.md
          de7388d531a025ce8fc72f2299f40d883bf7a238a90668ab8fc971bed9470517  tests/test_decomp_file11_179_stage.py
          HASHES
          sha256sum -c /tmp/file11-342-pinned-hashes
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("decomp")
          report=json.loads((p/"results/combined.json").read_text())
          inv=json.loads((p/"results/inventory.json").read_text())
          manifest=json.loads((p/"manifest.json").read_text())
          assert report["status"]=="matched"
          assert report["comparison"]["matched_functions"]==342
          assert report["comparison"]["claimed_functions"]==342
          assert report["comparison"]["matched_function_bytes"]==17568
          assert report["comparison"]["full_rom_match"] is True
          assert report["comparison"]["candidate_sha1"]=="6ea0ed71032ce08fc2745f412d84936382197494"
          assert manifest["overlay_file11_stage"]=={"format":"goemon-file11-179-central-v1"}
          assert report["overlay_file11_stage"]["original_address_matching_c"]==179
          assert report["overlay_file11_stage"]["original_semantic_file11_relocations"]==8825
          assert report["overlay_file11_stage"]["candidate_semantic_file11_relocations"]==8825
          assert inv["summary"]["identified_function_entries"]==7376
          assert inv["summary"]["newly_matching_c"]==342
          assert inv["summary"]["current_unmarked_entries"]==355
          assert inv["summary"]["remaining_assembly_entries"]==7021
          assert inv["summary"]["extra_positive_alias_entries"]==0
          assert len(report["comparison"]["functions"])==342
          print("342-C exact original-USA native G2 proof and inventory validated")
          PY
          git config user.name "Goemon Verified Decomp"
          git config user.email "goemon-verified@users.noreply.github.com"
          git rm -f .promotion/file11-342.patch.xz.b64
          git add -A decomp tests PROGRESS.md
          git diff --cached --check
          git commit -m "Promote 27 deduplicated USA file11 functions with exact 342-C proof"
          git push origin HEAD:refs/heads/chatgptweb/file11-179-promotion-20261116
