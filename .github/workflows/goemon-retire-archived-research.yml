name: Retire preserved Goemon research branches
on:
  pull_request:
    types: [closed]
    branches: [chatgptweb/decomp]
permissions:
  contents: write
jobs:
  retire:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    concurrency:
      group: goemon-research-retirement
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgptweb/decomp
          fetch-depth: 1
          persist-credentials: true
      - name: Check proof hashes and delete pinned historical refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/retire_archived_branches.py
