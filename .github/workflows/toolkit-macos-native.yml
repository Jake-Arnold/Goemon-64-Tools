name: Toolkit macOS native ABI smoke
on:
  pull_request:
    paths:
      - 'native/**'
      - 'practice/mupen_native*.py'
      - 'practice/native_trace_wire.py'
      - 'practice/native_state_control.py'
      - 'Run-Mac.sh'
      - 'scripts/build_mupen_input.sh'
      - 'tests/test_mupen_native*'
      - 'tests/test_native_trace_wire.py'
      - 'tests/test_native_state_control.py'
      - '.github/workflows/toolkit-macos-native.yml'
permissions:
  contents: read
jobs:
  native-abi:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: mupen64plus/mupen64plus-core
          ref: '2.6.0'
          path: .mupen-sdk
      - name: Compile scripted input against the real SDK
        run: bash scripts/build_mupen_input.sh .mupen-sdk/src/api
      - name: Verify native plugin ABI and frontend state machine (no ROM)
        env:
          GOEMON_NATIVE_INPUT_LIBRARY: build/goemon_mupen_input.dylib
        run: python -m unittest tests.test_mupen_native tests.test_native_trace_wire tests.test_native_state_control -v
