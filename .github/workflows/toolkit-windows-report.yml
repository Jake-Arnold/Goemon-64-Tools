name: Toolkit Windows report smoke

on:
  push:
    branches:
      - "toolkit/**"
  pull_request:
    paths:
      - "practice/reports.py"
      - "practice/reports_ui.py"
      - "tests/test_reports.py"
      - "tests/test_toolkit_version.py"
      - "tests/test_unlock_flag_catalog.py"
      - "practice/unlock_flag_catalog.py"
      - "practice/updater.py"
      - "practice/updater_ui.py"
      - "tests/test_updater.py"
      - "tests/test_updater_ui.py"
      - "practice/address_registry.py"
      - "practice/address_catalogue.py"
      - "practice/address_catalogue_ui.py"
      - "practice/address_catalogue_remote.py"
      - "practice/data/**"
      - "scripts/sync_address_catalogue.py"
      - "tests/test_address_registry.py"
      - "tests/test_address_metadata_sync.py"
      - "tests/test_address_catalogue_ui.py"
      - ".github/workflows/toolkit-windows-report.yml"

permissions:
  contents: read

jobs:
  portable-reports:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python practice modules
        run: python -m compileall -q practice
      - name: Validate committed address catalogue is complete
        run: python -m scripts.sync_address_catalogue --check
      - name: Verify Windows-compatible report and version functions
        run: python -m unittest tests.test_reports tests.test_discovery_results tests.test_value_search tests.test_toolkit_version tests.test_unlock_flag_catalog tests.test_address_registry tests.test_address_metadata_sync tests.test_updater -v
